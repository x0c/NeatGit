name: NeatGit
options:
  minimumXcodeGenVersion: 2.45.0
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: io.github.x0c.neatgit
    PRODUCT_NAME: NeatGit
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 26.0
    CODE_SIGN_STYLE: Automatic

targets:
  NeatGit:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: NeatGitApp
    settings:
      base:
        INFOPLIST_FILE: NeatGitApp/Info.plist
    scheme:
      testTargets:
        - NeatGitTests
        - NeatGitUITests

  NeatGitTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: NeatGitTests
    dependencies:
      - target: NeatGit
    settings:
      base:
        PRODUCT_NAME: NeatGitTests
        PRODUCT_BUNDLE_IDENTIFIER: io.github.x0c.neatgit.tests
        GENERATE_INFOPLIST_FILE: YES

  NeatGitUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: NeatGitUITests
    dependencies:
      - target: NeatGit
    settings:
      base:
        PRODUCT_NAME: NeatGitUITests
        PRODUCT_BUNDLE_IDENTIFIER: io.github.x0c.neatgit.uitests
        GENERATE_INFOPLIST_FILE: YES
